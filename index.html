<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺北市東門國小家長會</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Helvetica Neue', Arial, 'LiHei Pro', sans-serif; overflow: hidden; background-color: #f4f6f8; }
        
        /* 頂部極簡導覽列 */
        .top-navbar { background-color: #122235; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); position: relative; z-index: 10; height: 50px; }
        .nav-tabs { display: flex; gap: 5px; height: 100%; }
        .nav-tabs button { background-color: #1c3652; color: #a0b2c6; border: none; padding: 0 25px; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 16px; font-weight: bold; height: 42px; margin-top: auto; transition: all 0.2s; }
        .nav-tabs button:hover { background-color: #274769; color: white; }
        .nav-tabs button.active { background-color: #f4f6f8; color: #122235; height: 50px; } /* 作用中變成白色底 */
        
        .nav-right { color: #a0b2c6; font-size: 14px; margin-bottom: 15px; font-weight: bold; }
        .nav-right span { color: white; margin-left: 10px; }

        /* 內容載入區 */
        .content-container { height: calc(100% - 50px); width: 100%; position: relative; }
        iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; display: none; }
        iframe.active { display: block; }
    </style>
</head>
<body>
    <div class="top-navbar">
        <div class="nav-tabs">
            <button onclick="switchTab(this, 'frame-minutes')" class="active">會議紀錄查詢</button>
            <button onclick="switchTab(this, 'frame-newsletter')">會訊線上閱讀</button>
            <button onclick="switchTab(this, 'frame-donors')">捐款芳名錄</button>
        </div>
        <div class="nav-right">東門國小家長會 <span>114學年度</span></div>
    </div>

    <div class="content-container">
        <iframe id="frame-minutes" src="pages/minutes.html" class="active"></iframe>
        <iframe id="frame-newsletter" src="pages/newsletter.html"></iframe>
        <iframe id="frame-donors" src="pages/donors.html"></iframe>
    </div>

    <script>
        function switchTab(btn, frameId) {
            document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
            document.getElementById(frameId).classList.add('active');
        }
    </script>
</body>
</html>
