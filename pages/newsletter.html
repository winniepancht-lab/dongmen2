<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
  <title>會訊線上閱讀｜東門國小家長會</title>
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body class="page-body news-body">
  <a class="skip-link" href="#newsletter-main">跳至主要內容</a>
  <main id="newsletter-main" class="news-home">
    <header class="news-head"><div class="eyebrow">東門國小學生家長會</div><h1>家長會會訊</h1><p>以舊版書架與翻頁閱讀方式呈現新版會訊檔案；實際頁數依目錄自動更新。</p></header>
    <section id="shelf" class="shelf" aria-label="會訊書架"></section>
    <footer class="news-footer">點選封面進入閱讀器；閱讀器支援滑動、鍵盤方向鍵與縮圖導覽。</footer>
  </main>

  <section id="reader" class="reader" hidden role="dialog" aria-modal="true" aria-label="會訊閱讀器">
    <div class="reader-toolbar">
      <button id="reader-back" type="button">‹ 書架</button>
      <div id="reader-title" class="reader-title"></div>
      <div id="reader-page" class="reader-page-number"></div>
      <button id="reader-thumbs" type="button" aria-expanded="false">縮圖</button>
    </div>
    <div id="reader-stage-wrap" class="reader-stage">
      <div id="book-stage" class="book-stage" tabindex="0" aria-label="會訊頁面；點擊左右側翻頁"></div>
    </div>
    <div class="reader-bottom">
      <button id="reader-prev" type="button" aria-label="上一頁">‹</button>
      <input id="page-range" type="range" min="0" max="0" value="0" step="1" aria-label="頁面位置">
      <button id="reader-next" type="button" aria-label="下一頁">›</button>
    </div>
    <div id="thumbs" class="thumbs" hidden aria-label="頁面縮圖"></div>
  </section>

  <script src="../data.js" defer></script>
  <script src="../assets/js/newsletter.js" defer></script>
</body>
</html>
