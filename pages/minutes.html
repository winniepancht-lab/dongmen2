<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
  <title>會議紀錄查詢｜東門國小家長會</title>
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body class="page-body minutes-body">
  <a class="skip-link" href="#minutes-main">跳至主要內容</a>
  <main id="minutes-main" class="page-wrap">
    <header class="page-header">
      <div><div class="eyebrow">東門國小學生家長會</div><h1>會議紀錄查詢</h1><p>沿用舊版的年度／會議類型／日期導覽與展開式議案閱讀，同時保留新版資料自動產生架構。</p></div>
      <div class="stats" id="minute-stats" aria-label="會議紀錄統計"></div>
    </header>

    <section class="filters" aria-label="會議紀錄篩選">
      <div class="filter-row" id="year-filters" aria-label="學年度"></div>
      <div class="filter-row" id="type-filters" aria-label="會議類型"></div>
    </section>

    <section class="timeline-section" aria-label="日期導覽">
      <div class="section-label">會議時間軸</div>
      <div class="timeline" id="timeline"></div>
    </section>

    <section class="search-panel" aria-label="搜尋會議內容">
      <label class="search-box"><span class="visually-hidden">搜尋關鍵字</span><input id="minute-search" type="search" inputmode="search" autocomplete="off" placeholder="搜尋日期、會議標題、議案與內容…"></label>
      <div class="filter-row category-filters" id="category-filters" aria-label="議案類別"></div>
      <div class="result-summary" id="minute-result" aria-live="polite"></div>
    </section>

    <section id="meeting-list" class="meeting-list" aria-live="polite"></section>
  </main>
  <script src="../data.js" defer></script>
  <script src="../data/minutes_legacy.js" defer></script>
  <script src="../assets/js/minutes.js" defer></script>
</body>
</html>
